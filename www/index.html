<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Student Profile App</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="toast" class="toast hidden"></div>

    <div class="app-container">
        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <img id="profile-img" src="img/default-avatar.png" alt="Profile Picture" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'%2338bdf8\'><circle cx=\'50\' cy=\'35\' r=\'20\'/><path d=\'M 20,80 C 20,60 35,55 50,55 C 65,55 80,60 80,80 Z\'/></svg>';">
                </div>
                <button id="btn-change-photo" class="btn-photo">Change Photo</button>
            </div>

            <h1 id="view-name">Euan Jorn Dy Mercado</h1>
            <p id="view-course-year" class="tag">BS Information Technology - 3rd Year</p>
            <p id="view-student-id" class="id-badge">ID: 2021-100451</p>

            <div class="action-buttons">
                <button id="btn-edit-profile" class="btn btn-primary">Edit Profile</button>
                <button id="btn-crud-delete" class="btn btn-outline-danger">Delete Account (CRUD)</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Edit Profile</h2>
            <form id="edit-form">
                <div class="input-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="input-group">
                    <label for="edit-course">Course</label>
                    <input type="text" id="edit-course" required>
                </div>
                <div class="input-group">
                    <label for="edit-year">Year Level</label>
                    <input type="text" id="edit-year" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-cancel-edit" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
